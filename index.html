<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MONTÉRRE — Private Equestrian Club</title>
    <style>
      /* Instant boot cover — paints before JS/CSS modules arrive */
      html,
      body {
        margin: 0;
        background: #181e1f;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #181e1f;
        color: #f3f6f7;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-live="polite" aria-busy="true">
      <span>0%</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
