<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MONTÉRRE — Private Equestrian Club</title>
    <!-- Same face React uses — ready before first % paint -->
    <link
      rel="preload"
      href="/fonts/InstrumentSerif-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <style>
      /* Instant boot cover — Instrument Serif only, no Times flash */
      @font-face {
        font-family: "Instrument Serif";
        src: url("/fonts/InstrumentSerif-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        background: #181e1f;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #181e1f;
        color: #f3f6f7;
      }
      #boot-loader-pct {
        font-family: "Instrument Serif", serif;
        font-weight: 400;
        font-style: normal;
        font-size: clamp(32px, 4vw, 48px);
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-live="polite" aria-busy="true">
      <span id="boot-loader-pct">1%</span>
    </div>
    <script>
      /* Continuous optimistic % — React PageLoader picks up from here */
      (function () {
        window.__bootStarted = performance.now();
        window.__bootPct = 1;
        var el = document.getElementById("boot-loader-pct");
        if (!el) return;
        var shown = 1;
        var lastDigit = performance.now();
        function frame(now) {
          if (!document.getElementById("boot-loader")) return;
          var elapsed = now - window.__bootStarted;
          /* Soft climb toward ~18 while waiting for React — +1 only */
          var target = Math.min(18, 1 + Math.floor(elapsed / 45));
          if (shown < target && now - lastDigit >= 28) {
            shown += 1;
            lastDigit = now;
            window.__bootPct = shown;
            el.textContent = shown + "%";
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
