<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MONTÉRRE — Private Equestrian Club</title>
    <style>
      /* Instant boot cover — paints before JS/CSS modules arrive */
      html,
      body {
        margin: 0;
        background: #181e1f;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #181e1f;
        color: #f3f6f7;
        font-family: "Times New Roman", Times, serif;
        font-size: clamp(28px, 3.6vw, 42px);
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-live="polite" aria-busy="true">
      <span id="boot-loader-pct">1%</span>
    </div>
    <script>
      /* Optimistic % before React hydrates — avoids a long 0% stare */
      (function () {
        var el = document.getElementById("boot-loader-pct");
        if (!el) return;
        var n = 1;
        var id = setInterval(function () {
          if (!document.getElementById("boot-loader")) {
            clearInterval(id);
            return;
          }
          n = Math.min(18, n + 1);
          el.textContent = n + "%";
          if (n >= 18) clearInterval(id);
        }, 40);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
